<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>iThreeD Studio</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 60px auto; padding: 0 16px; line-height: 1.5; background: Canvas; color: CanvasText; }
  code { word-break: break-all; font-size: 13px; }
  a { color: #FF5A1F; }
</style>
</head>
<body>
<h2>iThreeD Studio</h2>
<p id="msg">Voltando para o iThreeD Studio…</p>
<p id="manual" hidden>Se o Studio não abriu, copie o endereço desta página e cole em <b>Vendas → Mercado Livre → Concluir conexão</b>.</p>
<script>
  // Repassa o código da autorização do Mercado Livre para o iThreeD Studio aberto neste computador.
  // Esta página não guarda nada: só redireciona para http://localhost.
  var q = location.search;
  if (/[?&]code=/.test(q)) {
    setTimeout(function () { document.getElementById('manual').hidden = false; }, 4000);
    location.replace('http://localhost/api/ml/callback' + q);
  } else {
    document.getElementById('msg').textContent = 'Nenhuma autorização para repassar.';
  }
</script>
</body>
</html>
